name: Export MioTTS-0.1B to Lightweight ONNX (WebGPU)

on:
  workflow_dispatch: # 手動実行ボタン

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers onnx onnxruntime onnxscript accelerate
          pip install git+https://github.com/Aratako/MioCodec.git

      # Pythonスクリプトから直接確実にONNX出力（optimum-cliを廃止）
      - name: Export Both LLM and MioCodec to ONNX
        run: |
          python - << 'EOF'
          import os
          import torch
          from transformers import AutoTokenizer, AutoModelForCausalLM
          from miocodec import MioCodecModel

          out_dir = "models/onnx"
          os.makedirs(f"{out_dir}/llm", exist_ok=True)

          # ==========================================
          # 1. MioTTS-0.1B (LLM本体) の直接エクスポート
          # ==========================================
          llm_id = "Aratako/MioTTS-0.1B"
          print(f"--- 1. Loading LLM: {llm_id} ---")
          tokenizer = AutoTokenizer.from_pretrained(llm_id, trust_remote_code=True)
          tokenizer.save_pretrained(out_dir)
          tokenizer.save_pretrained(f"{out_dir}/llm")

          # 推論モードでモデルをロード (FP32で読み込んでエクスポート)
          model = AutoModelForCausalLM.from_pretrained(
              llm_id,
              torch_dtype=torch.float32,
              trust_remote_code=True
          ).eval()

          class LLMWrapper(torch.nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              def forward(self, input_ids):
                  outputs = self.model(input_ids=input_ids)
                  return outputs.logits

          llm_wrapper = LLMWrapper(model)
          dummy_input = torch.tensor([[1, 2, 3, 4]], dtype=torch.long)

          print("--- 2. Exporting LLM to ONNX ---")
          torch.onnx.export(
              llm_wrapper,
              dummy_input,
              f"{out_dir}/llm/model.onnx",
              input_names=["input_ids"],
              output_names=["logits"],
              dynamic_axes={
                  "input_ids": {0: "batch_size", 1: "seq_len"},
                  "logits": {0: "batch_size", 1: "seq_len"}
              },
              opset_version=17,
              do_constant_folding=True
          )
          print("LLM ONNX export complete!")

          # ==========================================
          # 2. MioCodec-25Hz-24kHz (ボコーダー) の直接エクスポート
          # ==========================================
          codec_id = "Aratako/MioCodec-25Hz-24kHz"
          print(f"--- 3. Loading Vocoder: {codec_id} ---")
          codec = MioCodecModel.from_pretrained(codec_id).eval()

          class CodecDecoderWrapper(torch.nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              def forward(self, tokens, emb):
                  return self.model.decode(content_token_indices=tokens, global_embedding=emb)

          codec_wrapper = CodecDecoderWrapper(codec)
          dummy_tokens = torch.zeros((1, 50), dtype=torch.long)
          dummy_emb = torch.zeros((1, 256), dtype=torch.float32)

          print("--- 4. Exporting MioCodec to ONNX ---")
          torch.onnx.export(
              codec_wrapper,
              (dummy_tokens, dummy_emb),
              os.path.join(out_dir, "miocodec_decoder.onnx"),
              input_names=["tokens", "global_embedding"],
              output_names=["waveform"],
              dynamic_axes={
                  "tokens": {1: "seq_len"},
                  "waveform": {2: "audio_len"}
              },
              opset_version=17,
              do_constant_folding=True
          )
          print("MioCodec ONNX export complete!")
          EOF

      # 成果物（ONNXファイル一式）を保存
      - name: Upload ONNX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miotts-0.1b-webgpu-onnx
          path: models/onnx/

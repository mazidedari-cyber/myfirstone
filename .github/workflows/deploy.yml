name: Deploy MioTTS WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout mmnga/mio-tts-cpp
        uses: actions/checkout@v4
        with:
          repository: mmnga/mio-tts-cpp
          submodules: recursive

      - name: Checkout user repo
        uses: actions/checkout@v4
        with:
          path: user-files
          clean: false

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # モデルのダウンロード（Q4_K_Mも追加取得）
      - name: Download Models
        run: |
          chmod +x models_download.sh
          ./models_download.sh
          mkdir -p examples/wasm/public/model
          cp models/*.gguf examples/wasm/public/model/

          # 公式最軽量 4bit Q4_K_M モデルをダウンロードして配置
          echo "Downloading MioTTS-0.1B-Q4_K_M.gguf (79.6 MB)..."
          curl -L -o examples/wasm/public/model/MioTTS-0.1B-Q4_K_M.gguf \
            https://huggingface.co/Aratako/MioTTS-GGUF/resolve/main/MioTTS-0.1B-Q4_K_M.gguf || true

      # WASMエンジンの安定ビルド（CPU最適化）
      - name: Build WASM
        run: |
          cd examples/wasm
          chmod +x build.sh
          ./build.sh

      # 自立型 index.html の配置とスクリプト名の完全適合
      - name: Deploy Custom Standalone HTML
        run: |
          find examples/wasm -mindepth 2 -name "*.js" -exec cp -v {} examples/wasm/ \;
          find examples/wasm -mindepth 2 -name "*.wasm" -exec cp -v {} examples/wasm/ \;

          TARGET_JS=$(cd examples/wasm && ls *.js 2>/dev/null | grep -v "coi" | head -n 1)
          echo "確定したメインスクリプト: $TARGET_JS"

          cp user-files/index.html examples/wasm/index.html

          if [ -n "$TARGET_JS" ]; then
            sed -i "s|mio-tts\.js|$TARGET_JS|g" examples/wasm/index.html
            cp -v "examples/wasm/$TARGET_JS" examples/wasm/mio-tts.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 成果物を公開
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './examples/wasm'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

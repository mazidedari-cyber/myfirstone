name: Deploy MioTTS WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      # 【修正点1】先に mmnga/mio-tts-cpp をベースとしてクローン
      - name: Checkout mmnga/mio-tts-cpp
        uses: actions/checkout@v4
        with:
          repository: mmnga/mio-tts-cpp
          submodules: recursive

      # 【修正点2】後からあなた自身のリポジトリ（chat.html）を user-files フォルダに取得
      - name: Checkout user repo
        uses: actions/checkout@v4
        with:
          path: user-files

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # モデルのダウンロードと配置
      - name: Download Models
        run: |
          chmod +x models_download.sh
          ./models_download.sh
          mkdir -p examples/wasm/public/model
          cp models/*.gguf examples/wasm/public/model/

      # WASMのビルドを実行
      - name: Build WASM
        run: |
          cd examples/wasm
          chmod +x build.sh
          ./build.sh

      # 【修正点3】chat.html を確実に公開フォルダにコピー
      - name: Copy chat.html to public
        run: |
          echo "ユーザーファイルを確認します:"
          ls -la user-files
          cp user-files/chat.html examples/wasm/chat.html
          echo "chat.html のコピーに成功しました！"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 公開フォルダをアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './examples/wasm'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy MioTTS WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout mmnga/mio-tts-cpp
        uses: actions/checkout@v4
        with:
          repository: mmnga/mio-tts-cpp
          submodules: recursive

      - name: Checkout user repo
        uses: actions/checkout@v4
        with:
          path: user-files
          clean: false

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # モデルのダウンロードと配置
      - name: Download Models
        run: |
          chmod +x models_download.sh
          ./models_download.sh
          mkdir -p examples/wasm/public/model
          cp models/*.gguf examples/wasm/public/model/

      # WebGPUリンカーフラグ (-sUSE_WEBGPU=1) を含めて完全ビルド
      - name: Build WASM with Full WebGPU Support
        run: |
          cd examples/wasm
          chmod +x build.sh

          # 環境変数とcmakeフラグの両方でWebGPUライブラリを強制結合
          export EMCC_CFLAGS="-sUSE_WEBGPU=1"
          if grep -q "emcmake cmake" build.sh; then
            sed -i 's/emcmake cmake/emcmake cmake -DGGML_WEBGPU=ON -DCMAKE_EXE_LINKER_FLAGS="-sUSE_WEBGPU=1" -DCMAKE_CXX_FLAGS="-sUSE_WEBGPU=1"/g' build.sh
          fi

          ./build.sh

      # 自立型 index.html の配置とスクリプト名の完全適合
      - name: Deploy Custom Standalone HTML
        run: |
          find examples/wasm -mindepth 2 -name "*.js" -exec cp -v {} examples/wasm/ \;
          find examples/wasm -mindepth 2 -name "*.wasm" -exec cp -v {} examples/wasm/ \;

          TARGET_JS=$(cd examples/wasm && ls *.js 2>/dev/null | grep -v "coi" | head -n 1)
          echo "確定したメインスクリプト: $TARGET_JS"

          cp user-files/index.html examples/wasm/index.html

          if [ -n "$TARGET_JS" ]; then
            sed -i "s|mio-tts\.js|$TARGET_JS|g" examples/wasm/index.html
            cp -v "examples/wasm/$TARGET_JS" examples/wasm/mio-tts.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './examples/wasm'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

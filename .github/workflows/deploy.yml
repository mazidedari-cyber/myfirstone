name: Deploy MioTTS WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout mmnga/mio-tts-cpp
        uses: actions/checkout@v4
        with:
          repository: mmnga/mio-tts-cpp
          submodules: recursive

      - name: Checkout user repo
        uses: actions/checkout@v4
        with:
          path: user-files
          clean: false

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # モデルのダウンロードと配置
      - name: Download Models
        run: |
          chmod +x models_download.sh
          ./models_download.sh
          mkdir -p examples/wasm/public/model
          cp models/*.gguf examples/wasm/public/model/

      # WASMエンジンのビルドを実行
      - name: Build WASM
        run: |
          cd examples/wasm
          chmod +x build.sh
          ./build.sh

      # 自立型 index.html の配置と全スクリプトの集約
      - name: Deploy Custom Standalone HTML
        run: |
          echo "=== 1. 本家 index.html の script 設定を確認 ==="
          grep -i "<script" examples/wasm/index.html || true

          echo "=== 2. ビルドされた全JS・WASMファイルをルートへ集約 ==="
          find examples/wasm -mindepth 2 -name "*.js" -exec cp -v {} examples/wasm/ \;
          find examples/wasm -mindepth 2 -name "*.wasm" -exec cp -v {} examples/wasm/ \;

          # あなたの index.html を配置
          cp user-files/index.html examples/wasm/index.html

          # メインとなるWASMスクリプト（coi関連以外）を特定
          TARGET_JS=$(cd examples/wasm && ls *.js 2>/dev/null | grep -v "coi" | head -n 1)
          echo "確定したメインスクリプト: $TARGET_JS"

          if [ -n "$TARGET_JS" ]; then
            sed -i "s|src=\"mio-tts.js\"|src=\"$TARGET_JS\"|g" examples/wasm/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './examples/wasm'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

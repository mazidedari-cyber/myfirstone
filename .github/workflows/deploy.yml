name: Deploy MioTTS WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout mmnga/mio-tts-cpp
        uses: actions/checkout@v4
        with:
          repository: mmnga/mio-tts-cpp
          submodules: recursive

      - name: Checkout user repo
        uses: actions/checkout@v4
        with:
          path: user-files
          clean: false

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # モデルのダウンロードと配置
      - name: Download Models
        run: |
          chmod +x models_download.sh
          ./models_download.sh
          mkdir -p examples/wasm/public/model
          cp models/*.gguf examples/wasm/public/model/

      # 【第1ステップ】WebGPUフラグ (-DGGML_WEBGPU=ON) を注入してWASMをビルド
      - name: Build WASM with WebGPU
        run: |
          cd examples/wasm
          chmod +x build.sh

          echo "=== 既存の build.sh を確認 ==="
          cat build.sh

          # cmake呼び出し部分に WebGPU 有効化フラグを注入
          if grep -q "emcmake cmake" build.sh; then
            sed -i 's/emcmake cmake/emcmake cmake -DGGML_WEBGPU=ON/g' build.sh
          fi

          echo "=== WebGPU有効化後の build.sh ==="
          cat build.sh

          # ビルド実行
          ./build.sh

      # 自立型 index.html の配置とスクリプト名の完全適合
      - name: Deploy Custom Standalone HTML
        run: |
          echo "=== 1. ビルドされた全JS・WASMファイル ==="
          find examples/wasm -name "*.js" -o -name "*.wasm"

          # サブフォルダにあればルートへ集約
          find examples/wasm -mindepth 2 -name "*.js" -exec cp -v {} examples/wasm/ \;
          find examples/wasm -mindepth 2 -name "*.wasm" -exec cp -v {} examples/wasm/ \;

          # coi以外のメインWASMスクリプトを特定
          TARGET_JS=$(cd examples/wasm && ls *.js 2>/dev/null | grep -v "coi" | head -n 1)
          echo "確定したメインスクリプト: $TARGET_JS"

          # あなたの index.html を配置
          cp user-files/index.html examples/wasm/index.html

          # 1. index.html 内の 'mio-tts.js' を実際のファイル名に確実に置換
          if [ -n "$TARGET_JS" ]; then
            sed -i "s|mio-tts\.js|$TARGET_JS|g" examples/wasm/index.html
            # 2. 念のため mio-tts.js という別名コピーも配置
            cp -v "examples/wasm/$TARGET_JS" examples/wasm/mio-tts.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 成果物を公開
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './examples/wasm'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

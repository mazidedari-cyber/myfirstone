name: Deploy MioTTS WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout mmnga/mio-tts-cpp
        uses: actions/checkout@v4
        with:
          repository: mmnga/mio-tts-cpp
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # 【修正ポイント】先にモデルをダウンロードするように順序を変更しました
      - name: Download Models
        run: |
          chmod +x models_download.sh
          ./models_download.sh

      # モデルが揃った状態でWASMをビルドします
      - name: Build WASM
        run: |
          cd examples/wasm
          chmod +x build.sh
          ./build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # サイトとして公開するフォルダ（WASMのビルド出力先）をアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './examples/wasm'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

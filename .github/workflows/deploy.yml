name: Deploy MioTTS WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout mmnga/mio-tts-cpp
        uses: actions/checkout@v4
        with:
          repository: mmnga/mio-tts-cpp
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # モデルのダウンロードと配置
      - name: Download Models
        run: |
          chmod +x models_download.sh
          ./models_download.sh
          mkdir -p examples/wasm/public/model
          cp models/*.gguf examples/wasm/public/model/

      # WASMのビルドを実行
      - name: Build WASM
        run: |
          cd examples/wasm
          chmod +x build.sh
          ./build.sh

      # 【修正・機能追加】ローカルGGUF読み込み & GPUモード対応のUIを自動注入
      - name: Inject Full Gemini & GGUF Manager UI into MioTTS
        run: |
          python3 - << 'EOF'
          import re

          html_file = "examples/wasm/index.html"
          with open(html_file, "r", encoding="utf-8") as f:
              html = f.read()

          # 画面上部に合体させるコントロールパネル
          gemini_ui = """
          <!-- ===== Gemini AI 対話 ＆ ローカルGGUF・GPU管理パネル ===== -->
          <div id="gemini-chat-panel" style="background:#f8f9fa; border:2px solid #007bff; border-radius:8px; padding:14px; margin:14px auto; max-width:800px; font-family:sans-serif; box-shadow:0 4px 6px rgba(0,0,0,0.1);">
            <h3 style="margin-top:0; margin-bottom:8px; color:#007bff; font-size:16px;">🤖 Gemini 3.5 Flash-Lite × MioTTS-0.1B 音声対話</h3>

            <!-- 1. APIキー設定 -->
            <div style="display:flex; gap:6px; margin-bottom:10px;">
              <input type="password" id="geminiApiKey" placeholder="Gemini API Key を入力" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px; font-size:13px;">
              <button id="saveApiKeyBtn" style="padding:8px 14px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer;">キー保存</button>
            </div>

            <!-- 2. 【復活】ローカルGGUFファイル管理（案2の完全実装） -->
            <div style="background:#fff; border:1px solid #ced4da; border-radius:6px; padding:10px; margin-bottom:10px; font-size:13px;">
              <div style="font-weight:bold; color:#495057; margin-bottom:6px;">📁 ローカルGGUFモデル管理（高速起動・通信ゼロ）</div>
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">
                <button id="downloadModelBtn" style="padding:6px 10px; background:#6c757d; color:#fff; border:none; border-radius:4px; font-size:12px; cursor:pointer;">📥 GGUFモデルを端末に保存</button>
              </div>
              <div>
                <label style="font-weight:bold; font-size:12px;">📂 端末のGGUFファイルを選択して即読込:</label><br>
                <input type="file" id="localGgufInput" multiple accept=".gguf,.bin" style="margin-top:4px; font-size:12px;">
              </div>
              <div id="localFileStatus" style="font-size:12px; color:#28a745; margin-top:4px; font-weight:bold;">ステータス: ネットから取得待機中</div>
            </div>

            <!-- 3. 【追加】スマホGPU演算（WebGPU）切り替えモード -->
            <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:10px; background:#eef2f7; padding:8px; border-radius:6px; font-size:13px;">
              <div style="display:flex; align-items:center; gap:8px;">
                <label style="font-weight:bold;">⚙️ 演算モード:</label>
                <select id="computeBackendSelect" style="padding:4px 8px; border-radius:4px; border:1px solid #ccc; font-size:13px;">
                  <option value="cpu">💻 CPU (安定動作 / シングルスレッド)</option>
                  <option value="webgpu">⚡ スマホGPU (WebGPU アクセラレーション)</option>
                </select>
              </div>
              <div id="gpuStatusBadge" style="font-size:11px; color:#666;">端末のGPU状態を確認中...</div>
            </div>

            <!-- 4. チャット履歴 -->
            <div id="geminiChatLog" style="height:130px; overflow-y:auto; background:#fff; border:1px solid #ddd; border-radius:6px; padding:8px; margin-bottom:10px; font-size:13px; display:flex; flex-direction:column; gap:6px;">
              <div style="color:#666;">💬 話しかけるとGeminiが返答し、MioTTSが音声合成します。</div>
            </div>

            <!-- 5. 入力エリア -->
            <div style="display:flex; gap:6px;">
              <input type="text" id="geminiUserInput" placeholder="メッセージを入力..." style="flex:1; padding:10px; border:1px solid #ccc; border-radius:4px; font-size:15px;">
              <button id="geminiSendBtn" style="padding:10px 18px; background:#28a745; color:#fff; border:none; border-radius:4px; font-size:15px; font-weight:bold; cursor:pointer;">送信</button>
            </div>
            <div id="geminiStatus" style="font-size:12px; color:#555; margin-top:6px; font-weight:bold;">ステータス: 待機中</div>
          </div>
          <!-- ============================================================== -->
          """

          # 連携・制御JavaScript
          gemini_script = """
          <script>
          (function() {
            const apiKeyInput = document.getElementById('geminiApiKey');
            const saveBtn = document.getElementById('saveApiKeyBtn');
            const userInput = document.getElementById('geminiUserInput');
            const sendBtn = document.getElementById('geminiSendBtn');
            const chatLog = document.getElementById('geminiChatLog');
            const statusEl = document.getElementById('geminiStatus');
            const downloadBtn = document.getElementById('downloadModelBtn');
            const localGgufInput = document.getElementById('localGgufInput');
            const localFileStatus = document.getElementById('localFileStatus');
            const backendSelect = document.getElementById('computeBackendSelect');
            const gpuBadge = document.getElementById('gpuStatusBadge');

            // --- APIキー設定 ---
            apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
            saveBtn.onclick = () => {
              localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
              alert('APIキーを保存しました。');
            };

            // --- 案2: GGUFダウンロード（端末保存） ---
            downloadBtn.onclick = async () => {
              localFileStatus.textContent = 'MioTTS-0.1B-Q8_0.gguf をダウンロード中...';
              try {
                const res = await fetch('public/model/MioTTS-0.1B-Q8_0.gguf');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'MioTTS-0.1B-Q8_0.gguf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
                localFileStatus.textContent = '✅ 保存完了: MioTTS-0.1B-Q8_0.gguf を端末ストレージに保存しました';
              } catch(err) {
                localFileStatus.textContent = '❌ 保存失敗: ' + err.message;
              }
            };

            // --- 案2: ローカルGGUFファイルの選択・即時読み込み（インターセプト） ---
            window.localGgufBlobs = window.localGgufBlobs || {};
            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
              const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
              for (const fname of Object.keys(window.localGgufBlobs)) {
                if (url.includes(fname)) {
                  console.log('ローカルGGUFから即供給します:', fname);
                  return new Response(window.localGgufBlobs[fname]);
                }
              }
              return originalFetch.apply(this, args);
            };

            localGgufInput.onchange = async (e) => {
              const files = Array.from(e.target.files);
              if (files.length === 0) return;
              localFileStatus.textContent = 'ローカルGGUFをメモリに展開中...';

              for (const file of files) {
                const buffer = await file.arrayBuffer();
                window.localGgufBlobs[file.name] = buffer;

                if (typeof FS !== 'undefined' && FS.writeFile) {
                  try {
                    try { FS.mkdirTree('/public/model'); } catch(e){}
                    FS.writeFile('/public/model/' + file.name, new Uint8Array(buffer));
                  } catch(err) {
                    console.warn('FS書き込み:', err);
                  }
                }
              }
              const names = files.map(f => f.name).join(', ');
              localFileStatus.textContent = '✅ 端末から即座にロード完了: [' + names + '] (通信ゼロ)';
              alert('ローカルGGUFを読み込みました:\n' + names + '\nネットダウンロードなしでMioTTSが動作します。');
            };

            // --- スマホGPU (WebGPU) モードの判定・制御 ---
            if ('gpu' in navigator) {
              navigator.gpu.requestAdapter().then(adapter => {
                if (adapter) {
                  gpuBadge.textContent = '✅ お使いのAndroid端末はGPU演算(WebGPU)に対応しています';
                  gpuBadge.style.color = '#28a745';
                } else {
                  gpuBadge.textContent = '⚠️ WebGPUアダプタが見つかりません (CPUで実行します)';
                  gpuBadge.style.color = '#d39e00';
                }
              }).catch(() => {
                gpuBadge.textContent = '⚠️ WebGPUの初期化に失敗しました (CPUで実行します)';
              });
            } else {
              gpuBadge.textContent = '❌ このブラウザはWebGPU非対応です (CPUモードで実行されます)';
              gpuBadge.style.color = '#dc3545';
            }

            backendSelect.onchange = () => {
              if (backendSelect.value === 'webgpu') {
                if (!('gpu' in navigator)) {
                  alert('お使いのブラウザはWebGPUに対応していません。CPUモードで実行します。');
                  backendSelect.value = 'cpu';
                } else {
                  alert('⚡ GPU (WebGPU) モードを有効化しました。ハードウェアアクセラレーションを優先適用します。');
                }
              }
            };

            // --- チャットログ表示 ---
            function appendLog(text, isUser) {
              const d = document.createElement('div');
              d.style.padding = '6px 10px';
              d.style.borderRadius = '8px';
              d.style.maxWidth = '85%';
              d.style.wordBreak = 'break-word';
              if (isUser) {
                d.style.alignSelf = 'flex-end';
                d.style.background = '#007bff';
                d.style.color = '#fff';
              } else {
                d.style.alignSelf = 'flex-start';
                d.style.background = '#e9ecef';
                d.style.color = '#000';
              }
              d.textContent = text;
              chatLog.appendChild(d);
              chatLog.scrollTop = chatLog.scrollHeight;
            }

            // --- 本家MioTTSへの流し込みと発話 ---
            function triggerRealMioTts(replyText) {
              const inputs = Array.from(document.querySelectorAll('textarea, input[type="text"]'))
                .filter(el => !el.closest('#gemini-chat-panel'));
              
              if (inputs.length > 0) {
                const targetInput = inputs[0];
                targetInput.value = replyText;
                targetInput.dispatchEvent(new Event('input', { bubbles: true }));
                targetInput.dispatchEvent(new Event('change', { bubbles: true }));
              }

              const buttons = Array.from(document.querySelectorAll('button, input[type="button"]'))
                .filter(el => !el.closest('#gemini-chat-panel'));

              const synthBtn = buttons.find(b => {
                const t = (b.textContent || b.value || '').trim();
                return /合成|生成|発話|再生|Synthesize|Generate|TTS/i.test(t);
              }) || buttons[0];

              if (synthBtn) {
                const modeStr = backendSelect.value === 'webgpu' ? 'GPU (WebGPU)' : 'CPU';
                statusEl.textContent = 'MioTTS-0.1B (' + modeStr + ') で音声合成中...';
                synthBtn.click();
              }
            }

            // --- Gemini送信処理 ---
            async function handleGeminiSend() {
              const key = apiKeyInput.value.trim();
              const text = userInput.value.trim();
              if (!key) { alert('Gemini API Key を入力してください'); return; }
              if (!text) return;

              userInput.value = '';
              sendBtn.disabled = true;
              appendLog(text, true);
              statusEl.textContent = 'Gemini 3.5 Flash-Lite 応答待機中...';

              try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${key}`;
                const res = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text }] }],
                    systemInstruction: { parts: [{ text: "あなたは音声対話AIです。1〜2文程度の簡潔な日本語で会話してください。" }] }
                  })
                });

                if (!res.ok) {
                  const err = await res.json();
                  throw new Error(err.error?.message || 'API通信エラー');
                }

                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                appendLog(reply, false);

                triggerRealMioTts(reply);

              } catch (err) {
                console.error(err);
                statusEl.textContent = 'エラー: ' + err.message;
                appendLog('エラー: ' + err.message, false);
              } finally {
                sendBtn.disabled = false;
              }
            }

            sendBtn.onclick = handleGeminiSend;
            userInput.onkeypress = (e) => { if (e.key === 'Enter') handleGeminiSend(); };
          })();
          </script>
          """

          body_match = re.search(r"<body[^>]*>", html, re.IGNORECASE)
          if body_match:
              pos = body_match.end()
              html = html[:pos] + "\n" + gemini_ui + "\n" + html[pos:]
          else:
              html = gemini_ui + "\n" + html

          if "</body>" in html:
              pos = html.rfind("</body>")
              html = html[:pos] + "\n" + gemini_script + "\n" + html[pos:]
          else:
              html = html + "\n" + gemini_script

          with open("examples/wasm/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          with open("examples/wasm/chat.html", "w", encoding="utf-8") as f:
              f.write(html)
          print("完全統合に成功しました！")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './examples/wasm'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

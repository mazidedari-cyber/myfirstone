<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MioTTS-0.1B × Gemini 超高速対話Web</title>
  
  <script src="coi-serviceworker.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    h2 { margin: 0 0 10px 0; font-size: 17px; color: #38bdf8; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .card-title { font-weight: bold; margin-bottom: 6px; color: #94a3b8; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
    }
    input[type="file"] { font-size: 12px; color: #94a3b8; }
    button {
      padding: 8px 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    
    .status-text { font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 4px; }
    .status-detail { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }
    .msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 8px;
      line-height: 1.4;
      font-size: 14px;
    }
    .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg.ai { align-self: flex-start; background: #334155; color: #f8fafc; }

    .log-terminal {
      height: 110px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 6px;
      font-family: monospace;
      font-size: 10px;
      color: #4ade80;
      overflow-y: auto;
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>

  <script>
    window.earlyLogs = [];
    window.logToScreen = function(text, isError = false) {
      console.log(text);
      const time = new Date().toLocaleTimeString();
      const logLine = `[${time}] ${text}\n`;
      const term = document.getElementById('logTerminal');
      if (term) {
        term.textContent += logLine;
        if (isError) term.style.color = '#ef4444';
        term.scrollTop = term.scrollHeight;
      } else {
        window.earlyLogs.push(logLine);
      }
    };

    // 【最重要修正】LLMモデル要求のみをピンポイントでインターセプト（声色データやボコーダーは横取りしない）
    window.localGgufFileBlob = null;
    const origFetch = window.fetch;
    window.fetch = async function(...args) {
      const url = typeof args[0] === 'string' ? args[0] : (args[0]?.url || '');
      
      const isLlmModel = (url.includes('MioTTS-0.1B') || url.includes('Q8_0') || url.includes('Q4_K_M'))
                         && !url.includes('.emb.gguf') 
                         && !url.includes('miocodec');

      if (window.localGgufFileBlob && isLlmModel) {
        window.logToScreen('⚡【最速直結】LLM本体の要求を検知。端末のQ4_K_Mモデルを供給しました！');
        return new Response(window.localGgufFileBlob);
      }
      return origFetch.apply(this, args);
    };

    window.onerror = function(msg, url, line) {
      window.logToScreen(`❌ JSエラー: ${msg} (${line}行目)`, true);
    };
  </script>
</head>
<body>

  <!-- miottscpp.js 連携要素 -->
  <div style="display: none;">
    <canvas id="canvas"></canvas>
    <textarea id="text"></textarea>
    <button id="btn-generate"></button>
    <button id="btn-stop"></button>
    <div id="status"></div>
    <div id="metrics"></div>
    <select id="embedding"></select>
    
    <input id="n-threads" type="number" value="4">
    <input id="n-predict" type="number" value="128">
    <input id="ctx-size" type="number" value="512">
    <input id="temp" type="number" value="0.7">
    <input id="top-p" type="number" value="0.9">
    <input id="top-k" type="number" value="40">
    <input id="use-external-api" type="checkbox">
    <div id="api-settings"></div>
    <input id="api-base" value="">
    <input id="api-key" value="">
    <input id="api-model" value="">
    <button id="btn-load-wavlm"></button>
    <button id="btn-delete-reference"></button>
    <button id="btn-record-start"></button>
    <button id="btn-record-stop"></button>
    <input id="ref-file" type="file">
    <button id="btn-add-file"></button>
    <div id="ref-status"></div>
  </div>

  <h2>🎙️ MioTTS-0.1B × Gemini 超高速対話Web</h2>

  <div class="card">
    <div class="card-title">⚙️ システム構成 & 最軽量モデルロード</div>
    
    <div class="flex-row" style="margin-bottom: 6px;">
      <input type="password" id="apiKeyInput" placeholder="Gemini API Key を入力">
      <button id="saveKeyBtn">保存</button>
    </div>

    <div>
      <label style="font-weight: bold;">📂 端末のGGUFモデルを選択 (Q4_K_M 推奨 / 79.6MB):</label><br>
      <input type="file" id="ggufFileInput" accept=".gguf" style="margin-top: 4px;">
      <div id="modelStatus" style="font-size: 11px; color: #94a3b8; margin-top: 2px;">モデル: 未ロード</div>
      <div style="font-size: 11px; margin-top: 4px;">
        <a href="https://huggingface.co/Aratako/MioTTS-GGUF/resolve/main/MioTTS-0.1B-Q4_K_M.gguf" target="_blank" style="color: #38bdf8; text-decoration: underline;">
          📥 公式 MioTTS-0.1B-Q4_K_M.gguf (79.6MB) を直接ダウンロード
        </a>
      </div>
    </div>
  </div>

  <div style="margin-bottom: 8px;">
    <audio id="player" controls style="width: 100%;"></audio>
  </div>

  <div class="status-text" id="statusText">システム初期化中...</div>
  <div class="status-detail" id="statusDetail">待機中</div>

  <div class="chat-box" id="chatBox">
    <div class="msg ai">準備中...</div>
  </div>

  <div class="flex-row" style="margin-bottom: 8px;">
    <input type="text" id="userInput" placeholder="メッセージを入力...">
    <!-- 初期状態は準備完了まで無効化 -->
    <button id="sendBtn" disabled>⏳ モデル準備中...</button>
  </div>

  <div style="font-size: 11px; color: #94a3b8; margin-bottom: 2px;">🔍 リアルタイム診断ログ:</div>
  <div class="log-terminal" id="logTerminal"></div>

  <script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const ggufFileInput = document.getElementById('ggufFileInput');
    const modelStatus = document.getElementById('modelStatus');
    const statusText = document.getElementById('statusText');
    const statusDetail = document.getElementById('statusDetail');
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const logTerminal = document.getElementById('logTerminal');

    const textEl = document.getElementById('text');
    const btnGenerate = document.getElementById('btn-generate');
    const miottsStatus = document.getElementById('status');
    const player = document.getElementById('player');

    let generateStartTime = 0;

    if (window.earlyLogs && window.earlyLogs.length > 0) {
      logTerminal.textContent += window.earlyLogs.join('');
      window.earlyLogs = [];
    }

    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    saveKeyBtn.onclick = () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
      alert('APIキーを保存しました。');
    };

    // ステータス監視 ＆ フライング防止ガード
    const observer = new MutationObserver(() => {
      if (miottsStatus && miottsStatus.textContent) {
        statusDetail.textContent = miottsStatus.textContent;
        window.logToScreen('[MioTTS-Status] ' + miottsStatus.textContent);

        // readyになったら安全に送信ボタンを有効化！
        if (miottsStatus.textContent.includes('ready')) {
          sendBtn.disabled = false;
          sendBtn.textContent = '送信';
          statusText.textContent = "システム準備完了 ✅";
          const msgAi = document.querySelector('.msg.ai');
          if (msgAi && msgAi.textContent === "準備中...") {
            msgAi.textContent = "準備完了！話しかけてみてください。";
          }
        }

        if (miottsStatus.textContent.includes('done') && generateStartTime > 0) {
          const elapsed = ((Date.now() - generateStartTime) / 1000).toFixed(1);
          statusText.textContent = `生成完了！(所要時間: ${elapsed}秒) 🔊`;
          window.logToScreen(`★ 音声生成完了: ${elapsed} 秒`);
          generateStartTime = 0;
        }
      }
    });
    observer.observe(miottsStatus, { childList: true, characterData: true, subtree: true });

    player.onplay = () => {
      window.logToScreen('音声再生を開始しました');
    };

    ggufFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      window.localGgufFileBlob = file;
      modelStatus.textContent = `モデル: ${file.name} を登録完了 ✅ (通信ゼロ)`;
      window.logToScreen(`GGUF待機完了: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`);
      alert(`最軽量モデル [${file.name}] をセットしました！`);
    };

    async function loadMioTtsApp() {
      window.logToScreen("miottscpp.js をロードしてシステムを起動します...");
      try {
        await import('./miottscpp.js');
        window.logToScreen("★ MioTTS コントローラーの起動に成功しました！");
      } catch (err) {
        window.logToScreen("❌ 起動エラー: " + err.message, true);
        statusText.textContent = "システム起動エラー";
        statusText.style.color = '#ef4444';
      }
    }
    window.addEventListener('DOMContentLoaded', loadMioTtsApp);

    function appendMsg(text, isUser) {
      const el = document.createElement('div');
      el.className = `msg ${isUser ? 'user' : 'ai'}`;
      el.textContent = text;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Gemini API
    async function callGemini(prompt) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) throw new Error("Gemini APIキーを入力してください");

      window.logToScreen('Gemini API (3.5-flash-lite) に送信');
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: { parts: [{ text: "あなたはフレンドリーな対話AIです。10文字〜15文字程度の極めて短い一言（相槌など）で返答してください。長文は絶対に禁止です。" }] }
        })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || "Gemini APIエラー");
      }
      const data = await res.json();
      return data.candidates[0].content.parts[0].text;
    }

    function triggerMioTtsVoice(replyText) {
      statusText.textContent = "MioTTS-0.1B (Q4_K_M) で高速生成中...";
      window.logToScreen('MioTTS 音声生成トリガー: ' + replyText);

      generateStartTime = Date.now();
      player.play().catch(() => {});

      textEl.value = replyText;
      textEl.dispatchEvent(new Event('input', { bubbles: true }));
      textEl.dispatchEvent(new Event('change', { bubbles: true }));

      btnGenerate.click();
      window.logToScreen('MioTTS 生成処理を開始しました');
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      sendBtn.disabled = true;
      appendMsg(text, true);

      try {
        statusText.textContent = "Gemini 3.5 Flash-Lite 問い合わせ中...";
        const reply = await callGemini(text);
        appendMsg(reply, false);

        triggerMioTtsVoice(reply);
      } catch (err) {
        appendMsg(`エラー: ${err.message}`, false);
        statusText.textContent = "エラーが発生しました";
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = handleSend;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') handleSend(); };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MioTTS-0.1B × Gemini 自立推論システム</title>
  
  <script src="coi-serviceworker.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    h2 { margin: 0 0 10px 0; font-size: 17px; color: #38bdf8; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .card-title { font-weight: bold; margin-bottom: 6px; color: #94a3b8; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
    }
    input[type="file"] { font-size: 12px; color: #94a3b8; }
    button {
      padding: 8px 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    select {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
    }
    
    .status-text { font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 4px; }
    .status-detail { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }
    .msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 8px;
      line-height: 1.4;
      font-size: 14px;
    }
    .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg.ai { align-self: flex-start; background: #334155; color: #f8fafc; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    .badge.success { background: #065f46; color: #34d399; }
    .badge.warn { background: #854d0e; color: #fde047; }

    .log-terminal {
      height: 100px;
      background: #000;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 6px;
      font-family: monospace;
      font-size: 10px;
      color: #4ade80;
      overflow-y: auto;
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>

  <script>
    window.earlyLogs = [];
    window.logToScreen = function(text, isError = false) {
      console.log(text);
      const time = new Date().toLocaleTimeString();
      const logLine = `[${time}] ${text}\n`;
      const term = document.getElementById('logTerminal');
      if (term) {
        term.textContent += logLine;
        if (isError) term.style.color = '#ef4444';
        term.scrollTop = term.scrollHeight;
      } else {
        window.earlyLogs.push(logLine);
      }
    };

    // ローカルGGUFファイルを fetch に割り込ませて直供給するインターセプター
    window.localGgufFileBlob = null;
    const origFetch = window.fetch;
    window.fetch = async function(...args) {
      const url = typeof args[0] === 'string' ? args[0] : (args[0]?.url || '');
      if (window.localGgufFileBlob && url.includes('MioTTS-0.1B-Q8_0.gguf')) {
        window.logToScreen('⚡【インターセプト成功】端末のローカルGGUFファイルをWASMに直供給します！');
        return new Response(window.localGgufFileBlob);
      }
      return origFetch.apply(this, args);
    };

    window.onerror = function(msg, url, line) {
      window.logToScreen(`❌ JSエラー: ${msg} (${line}行目)`, true);
    };
  </script>
</head>
<body>

  <!-- 【超重要】miottscpp.js が動作に必須とする要素群（初期値設定済み） -->
  <div style="display: none;">
    <canvas id="canvas"></canvas>
    <textarea id="text"></textarea>
    <button id="btn-generate"></button>
    <button id="btn-stop"></button>
    <div id="status"></div>
    <div id="metrics"></div>
    <select id="embedding"></select>
    <input id="temp" type="number" value="0.7">
    <input id="top-p" type="number" value="0.9">
    <input id="top-k" type="number" value="40">
    <input id="n-threads" type="number" value="4">
    <input id="ctx-size" type="number" value="2048">
    <input id="n-predict" type="number" value="512">
    <input id="use-external-api" type="checkbox">
    <div id="api-settings"></div>
    <input id="api-base" value="">
    <input id="api-key" value="">
    <input id="api-model" value="">
    <button id="btn-load-wavlm"></button>
    <button id="btn-delete-reference"></button>
    <button id="btn-record-start"></button>
    <button id="btn-record-stop"></button>
    <input id="ref-file" type="file">
    <button id="btn-add-file"></button>
    <div id="ref-status"></div>
  </div>

  <h2>🎙️ MioTTS-0.1B × Gemini 自立推論Web</h2>

  <!-- 1. 設定 & モデルロード パネル -->
  <div class="card">
    <div class="card-title">⚙️ システム構成 & モデルロード</div>
    
    <div class="flex-row" style="margin-bottom: 6px;">
      <input type="password" id="apiKeyInput" placeholder="Gemini API Key を入力">
      <button id="saveKeyBtn">保存</button>
    </div>

    <div class="flex-row" style="margin-bottom: 6px;">
      <label>演算モード:</label>
      <select id="backendSelect">
        <option value="cpu">💻 CPU (WASM)</option>
        <option value="webgpu">⚡ スマホGPU (WebGPU)</option>
      </select>
      <span id="gpuStatus" class="badge warn">GPU確認中...</span>
    </div>

    <div>
      <label style="font-weight: bold;">📂 端末のGGUFモデルを直接読み込む (MioTTS-0.1B-Q8_0.gguf):</label><br>
      <input type="file" id="ggufFileInput" accept=".gguf" style="margin-top: 4px;">
      <div id="modelStatus" style="font-size: 11px; color: #94a3b8; margin-top: 2px;">モデル: 未ロード</div>
    </div>
  </div>

  <!-- 音声プレーヤー（miottscpp.jsが出力音声をセットする場所） -->
  <div style="margin-bottom: 8px;">
    <audio id="player" controls style="width: 100%;"></audio>
  </div>

  <div class="status-text" id="statusText">システム初期化中...</div>
  <div class="status-detail" id="statusDetail">待機中</div>

  <!-- 2. チャットエリア -->
  <div class="chat-box" id="chatBox">
    <div class="msg ai">準備完了！Gemini APIキーを保存し、話しかけてください。</div>
  </div>

  <!-- 3. 入力エリア -->
  <div class="flex-row" style="margin-bottom: 8px;">
    <input type="text" id="userInput" placeholder="メッセージを入力...">
    <button id="sendBtn">送信</button>
  </div>

  <!-- 4. リアルタイム診断ログ -->
  <div style="font-size: 11px; color: #94a3b8; margin-bottom: 2px;">🔍 リアルタイム診断ログ:</div>
  <div class="log-terminal" id="logTerminal"></div>

  <script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const backendSelect = document.getElementById('backendSelect');
    const gpuStatus = document.getElementById('gpuStatus');
    const ggufFileInput = document.getElementById('ggufFileInput');
    const modelStatus = document.getElementById('modelStatus');
    const statusText = document.getElementById('statusText');
    const statusDetail = document.getElementById('statusDetail');
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const logTerminal = document.getElementById('logTerminal');

    // miottscpp との連携要素
    const textEl = document.getElementById('text');
    const btnGenerate = document.getElementById('btn-generate');
    const miottsStatus = document.getElementById('status');
    const player = document.getElementById('player');

    if (window.earlyLogs && window.earlyLogs.length > 0) {
      logTerminal.textContent += window.earlyLogs.join('');
      window.earlyLogs = [];
    }

    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    saveKeyBtn.onclick = () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
      alert('APIキーを保存しました。');
    };

    // WebGPU確認
    async function checkWebGPU() {
      if ('gpu' in navigator) {
        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (adapter) {
            gpuStatus.textContent = 'WebGPU利用可能 ✅';
            gpuStatus.className = 'badge success';
            window.logToScreen('WebGPU アダプター検出成功');
            return;
          }
        } catch (e) {}
      }
      gpuStatus.textContent = 'CPUモードのみ 💻';
      gpuStatus.className = 'badge warn';
      backendSelect.value = 'cpu';
    }
    checkWebGPU();

    // miottscpp.js の内部ステータス変化を画面に同期
    const observer = new MutationObserver(() => {
      if (miottsStatus && miottsStatus.textContent) {
        statusDetail.textContent = miottsStatus.textContent;
        window.logToScreen('[MioTTS-Status] ' + miottsStatus.textContent);
      }
    });
    observer.observe(miottsStatus, { childList: true, characterData: true, subtree: true });

    // 音声再生が始まったら表示を切り替え
    player.onplay = () => {
      statusText.textContent = "音声再生中 🔊";
      window.logToScreen('MioTTS 本物音声の再生を開始しました');
    };

    // GGUFファイル選択処理（インターセプト用Blobの確保）
    ggufFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      window.localGgufFileBlob = file;
      modelStatus.textContent = `モデル: ${file.name} を設定完了 ✅ (通信ゼロ)`;
      statusText.textContent = "ローカルGGUFモデル準備完了 ✅";
      window.logToScreen(`ローカルGGUFを待機させました: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`);
      alert(`GGUFモデル [${file.name}] をセットしました！\nこれでネット通信を行わずに端末内のモデルが直接使われます。`);
    };

    // miottscpp.js をESモジュールとして読み込み
    async function loadMioTtsApp() {
      window.logToScreen("miottscpp.js をロードしてシステムを起動します...");
      try {
        await import('./miottscpp.js');
        window.logToScreen("★ MioTTS コントローラーの起動に完全成功しました！");
        statusText.textContent = "MioTTS システム準備完了 ✅";
      } catch (err) {
        window.logToScreen("❌ 起動エラー: " + err.message, true);
        statusText.textContent = "システム起動エラー";
        statusText.style.color = '#ef4444';
      }
    }
    window.addEventListener('DOMContentLoaded', loadMioTtsApp);

    function appendMsg(text, isUser) {
      const el = document.createElement('div');
      el.className = `msg ${isUser ? 'user' : 'ai'}`;
      el.textContent = text;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Gemini API
    async function callGemini(prompt) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) throw new Error("Gemini APIキーを入力してください");

      window.logToScreen('Gemini API (3.5-flash-lite) に送信');
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: { parts: [{ text: "あなたは音声対話AIです。1〜2文程度の簡潔な日本語で会話してください。" }] }
        })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || "Gemini APIエラー");
      }
      const data = await res.json();
      return data.candidates[0].content.parts[0].text;
    }

    // 本物のMioTTS音声合成を実行
    function triggerMioTtsVoice(replyText) {
      statusText.textContent = "MioTTS-0.1B で音声生成中...";
      window.logToScreen('MioTTS 音声生成トリガー: ' + replyText);

      // モバイル自動再生制限解除
      player.play().catch(() => {});

      // 1. テキストをセット
      textEl.value = replyText;
      textEl.dispatchEvent(new Event('input', { bubbles: true }));
      textEl.dispatchEvent(new Event('change', { bubbles: true }));

      // 2. 音声生成ボタンをクリック
      btnGenerate.click();
      window.logToScreen('MioTTS 生成処理を開始しました');
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      sendBtn.disabled = true;
      appendMsg(text, true);

      try {
        statusText.textContent = "Gemini 3.5 Flash-Lite 問い合わせ中...";
        const reply = await callGemini(text);
        appendMsg(reply, false);

        // 本物のMioTTS-0.1Bで発話
        triggerMioTtsVoice(reply);
      } catch (err) {
        appendMsg(`エラー: ${err.message}`, false);
        statusText.textContent = "エラーが発生しました";
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = handleSend;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') handleSend(); };
  </script>
</body>
</html>
